<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">

<head>
  <meta charset="utf-8">
  {% assign p = site.data.profile %}
  <title>{% if page.url != '/' and page.title %}{{ page.title }} · {% endif %}{{ p.first_name }} {{ p.last_name }}</title>
  <meta name="description" content="{{ p.description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <script>
    /* Runs before first paint: restores the saved theme and enables the
       scroll-reveal styles (without JS, everything stays visible). */
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>

  <link rel="preload" href="{{ '/assets/fonts/vendor/jetbrains-mono/JetBrainsMono-Medium.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/view-transitions.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body class="{{ page.body_class }}">
   <div class="site">
    <div class="container {{ page.container_class }}">
      {% include nav.html %}

      {{ content }}

      {% include footer.html %}
    </div>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>

</html>
